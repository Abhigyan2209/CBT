function tick(){let r=Math.min(DUR,end-Date.now());if(r<=0){$("timer").textContent="00:00:00";finish();return}
let s=Math.ceil(r/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");
$("timer").textContent=p(h)+":"+p(m)+":"+p(x);$("timer").style.background=r<600000?"#b91c1c":""}
function show(i){idx=i;vis[i]=1;const q=Q[i];$("qn").textContent="Question "+(i+1)+" / "+TOTAL;$("sub").textContent="Q."+q[0]+" · "+(q[0]<=45?"Physics":q[0]<=90?"Chemistry":"Biology");
$("mk").textContent=mk[i]?"★ Marked for review":"";$("flag").innerHTML=q[3]?'<div class="flag">⚠ '+q[3]+'</div>':"";$("qt").textContent=q[1];$("fig").innerHTML=IMG[q[0]]?'<img class="fig" src="'+IMG[q[0]]+'" alt="Figure for question '+q[0]+'" onclick="zoom(this.src)"><div style="font-size:12px;color:var(--m);margin:-4px 0 8px">Tap the figure to enlarge</div>':"";
$("opts").innerHTML=q[2].map((o,k)=>'<label class="opt'+(ans[i]===k?" s":"")+'"><input type="radio" name="o" '+(ans[i]===k?"checked":"")+' onchange="pick('+k+')"><span>('+(k+1)+') '+esc(o)+'</span></label>').join("");pal()}
